<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notice-hub · 风铃通知</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Corporate Clean 设计令牌（企业简洁风） */
:root{
  --c-primary:#2563eb; --c-primary-hover:#1d4ed8; --c-primary-50:#eff6ff; --c-ring:#3b82f6;
  --c-bg:#f8fafc; --c-card:#fff;
  --c-border:#e5e7eb; --c-border-strong:#d1d5db;
  --t1:#111827; --t2:#374151; --t3:#6b7280; --t4:#9ca3af;
  --r-lg:8px; --r-xl:12px;
  --sh-sm:0 1px 2px rgba(16,24,40,.05);
  --sh-md:0 4px 12px rgba(16,24,40,.10);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--t2);line-height:1.6;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

/* 居中白色企业卡片 */
.entry-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:40px 36px;max-width:420px;width:100%;text-align:center}
.entry-icon{width:52px;height:52px;margin:0 auto 18px;border-radius:var(--r-lg);background:var(--c-primary-50);display:flex;align-items:center;justify-content:center;color:var(--c-primary)}
.entry-icon svg{width:28px;height:28px;fill:currentColor}
.entry-card h1{font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--t1);margin-bottom:8px}
.entry-card p{color:var(--t3);margin-bottom:26px;font-size:14px}

/* 主按钮：扁平蓝、轻投影、微浮与按压反馈 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 18px;border:1px solid var(--c-primary);border-radius:var(--r-lg);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;text-decoration:none;background:var(--c-primary);color:#fff;box-shadow:var(--sh-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);background:var(--c-primary-hover);border-color:var(--c-primary-hover);text-decoration:none}
.btn:active{transform:translateY(0) scale(.98);box-shadow:var(--sh-sm)}
.btn:focus-visible{outline:2px solid var(--c-ring);outline-offset:2px}
.btn-secondary{margin-top:10px;background:#fff;border-color:var(--c-border-strong);color:var(--t2)}
.btn-secondary:hover{background:#fff;border-color:var(--c-primary);color:var(--c-primary)}

.entry-footer{margin-top:22px;font-size:12px;color:var(--t4)}
.entry-footer a{color:var(--t4)}
.entry-footer a:hover{color:var(--t3)}

@media (prefers-reduced-motion:reduce){
  *,.btn{transition:none!important}
}
</style>
</head>
<body>

  <main class="entry-card">
    <div class="entry-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    </div>
    <h1>notice-hub</h1>
    <p>风铃通知服务。进入后台管理通知内容，或查看组件嵌入效果。</p>

    <a class="btn" href="admin.html">进入管理后台</a>
    <a class="btn btn-secondary" href="preview.html">查看组件预览</a>

    <div class="entry-footer">
      <a href="https://github.com/govmoe/Zephyr-Notification">002.HK and EXYON.EE</a>
    </div>
  </main>

<script>
// 若偏好直接进入后台，可将下一行取消注释

</script>
</body>
</html>
